name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: middleware (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go vet ./...
      - run: go test ./...

  python:
    name: py-monitor (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/py-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  java:
    name: java-cache (maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/java-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -q test

  shell:
    name: shell-sync (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n platform/shell-sync/sync.sh
